name: Build local map

# Builds map/israel.pmtiles (OpenMapTiles schema, from OpenStreetMap via Planetiler)
# and copies the label fonts to fonts/. Runs when these build files change, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-map.yml
      - tools/fetch_fonts.py

permissions:
  contents: write

concurrency:
  group: build-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Planetiler
        run: wget -q -O planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
      - name: Build map tiles (largest zoom that fits GitHub's 100 MB file limit)
        run: |
          mkdir -p map
          for Z in 14 13 12; do
            java -Xmx6g -jar planetiler.jar --area=israel-and-palestine --download \
              --output=map/israel.pmtiles --maxzoom=$Z --languages=he,en,ar --force
            SIZE=$(stat -c %s map/israel.pmtiles)
            echo "maxzoom $Z -> $SIZE bytes"
            if [ "$SIZE" -lt 95000000 ]; then echo "maxzoom=$Z bytes=$SIZE built=$(date -u +%F)" > map/build.txt; break; fi
          done
          ls -la map
          test -f map/build.txt
      - name: Copy label fonts
        run: python tools/fetch_fonts.py fonts | tee -a map/build.txt && du -sh fonts
      - name: Commit
        run: |
          rm -rf data planetiler.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map fonts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build local map tiles and fonts"
          git pull --rebase origin main
          git push origin HEAD:main
