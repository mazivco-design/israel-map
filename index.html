<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>תבליט ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
/* Layout: full-bleed map; title block top-right; survey point log top-left; instrument bar bottom */
:root{
  --bg:#0f1716; --panel:rgba(18,28,26,.88); --line:#2c3d39; --fg:#e8efe9; --muted:#9db0a8;
  --accent:#e9b84a; --pin:#ff7a4d;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:pan-x pan-y}
/* the page itself never zooms (pinching is for the map); buttons get no double-tap zoom */
button,input,select{touch-action:manipulation}
#map{position:fixed;inset:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:10px 14px;max-width:min(300px,calc(50vw - 18px));z-index:2}
#title h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.1}
#title p{margin:.3rem 0 0;color:var(--muted);font-size:.82rem;line-height:1.4}
#log{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:min(300px,calc(50vw - 18px));padding:8px 10px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 200px);z-index:2}
#log header{display:flex;align-items:center;justify-content:space-between;gap:6px}
#log h2{margin:0;font-size:.85rem;font-weight:700;color:var(--muted)}
#last{font-family:var(--display);font-size:1.5rem;color:var(--accent);line-height:1.1}
#lastco{color:var(--muted);font-size:.74rem;direction:ltr;text-align:right}
#lastnote{color:var(--muted);font-size:.72rem}
#rows{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
#rows li{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;font-size:.82rem;padding:3px 2px;border-top:1px solid var(--line)}
#rows .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pin);color:#1b0c05;font-weight:700;font-size:.72rem}
#rows .h{font-weight:700}
#rows .d{color:var(--muted);font-size:.74rem;white-space:nowrap}
#rows button{padding:0 6px;border:none;color:var(--muted);font-size:1rem;line-height:1}
#panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:860px;margin-inline:auto;z-index:2}
.ctl{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.ctl label{color:var(--muted);white-space:nowrap}
input[type=range]{accent-color:var(--accent);width:120px}
button.step{width:30px;height:30px;padding:0;font-size:1.1rem;line-height:1;font-weight:700}
#exv,#sunv{font-variant-numeric:tabular-nums;min-width:2.6em;font-weight:700}
#sunctl{flex:1 1 100%}
#sunt{width:200px}
#sunnote{color:var(--muted);font-size:.78rem}
#sundate{font-size:.82rem;color:var(--muted)}
button{font:inherit;font-size:.86rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button[aria-pressed=true]{background:var(--accent);color:#1b1607;border-color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;border-radius:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend{display:flex;flex-direction:column;gap:3px;flex:1 1 180px;min-width:0}
#ramp{height:10px;border-radius:3px}
#ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
#stypes{margin-bottom:6px}
#b-clear{white-space:nowrap}
#prof{position:fixed;left:12px;right:12px;max-width:860px;margin-inline:auto;padding:8px 12px;z-index:3;display:flex;flex-direction:column;gap:4px}
#prof header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.8rem}
#prof header b{font-size:.92rem}
#profstats{color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
#prof .pbtns{display:flex;gap:6px}
#prof .pbtns button{padding:3px 10px}
#profcv{width:100%;height:150px;touch-action:none;direction:ltr;cursor:crosshair}
#profhover{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums;min-height:1.1em}
.profdot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #ff5fa2;box-shadow:0 0 6px rgba(0,0,0,.6)}
#mine .chart{border:none;padding:0 4px;font-size:.95rem}
.tk{display:inline-flex;align-items:center;gap:5px;font-size:.8rem}.tk i{width:16px;height:4px;border-radius:2px}
#tracknote{color:var(--muted);font-size:.74rem}
#stypes button,#log .seg button{font-size:.8rem;padding:4px 10px}
#mine-n:empty{display:none}
#mine-n{display:inline-block;min-width:1.3em;border-radius:999px;background:rgba(0,0,0,.35);font-size:.72rem;padding:0 4px;margin-inline-start:2px}
#mine{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
#mine li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;padding:4px 2px;border-top:1px solid var(--line)}
#mine li:first-child{border-top:none}
#mine i{width:12px;height:12px;border-radius:50%}
#mine .go{border:none;padding:0;text-align:right;display:flex;flex-direction:column;gap:1px;min-width:0;border-radius:4px}
#mine .go b{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mine .go span{color:var(--muted);font-size:.72rem}
#mine .x{border:none;padding:0 6px;font-size:1rem;color:var(--muted)}
#mineinfo{color:var(--muted);font-size:.76rem;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px}
#pane-mine{display:flex;flex-direction:column;min-height:0;gap:4px}
.pin{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.pin b{font:700 .78rem var(--body);color:#1b0c05;background:var(--pin);padding:1px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.pin i{width:2px;height:10px;background:var(--pin)}
.pin s{width:9px;height:9px;border-radius:50%;background:var(--pin);box-shadow:0 0 0 2px #1b0c05;text-decoration:none}
.maplibregl-ctrl-attrib{font-size:10px}
#search{position:relative;margin-top:8px}
#search form{display:flex;gap:6px}
#q{flex:1;min-width:0;font:inherit;font-size:.9rem;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
#q::placeholder{color:var(--muted)}
#results{list-style:none;margin:6px 0 0;padding:0;max-height:min(50vh,320px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#results button{width:100%;text-align:right;border:none;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;background:transparent}
#results button:hover,#results button:focus-visible{background:rgba(233,184,74,.14)}
#results .rn{font-weight:700;font-size:.88rem}
#results .rd{color:var(--muted);font-size:.74rem;line-height:1.3}
#smsg{color:var(--muted);font-size:.78rem;margin:6px 0 0}
#addsel{font:inherit;font-size:.86rem;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:46vw}
#selinfo{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
#selctl{flex:1 1 100%}
#chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:2px;background:rgba(243,196,90,.18);border:1px solid #f3c45a;color:var(--fg);border-radius:999px;padding:1px 4px 1px 9px;font-size:.8rem}
.chip button{border:none;padding:0 5px;font-size:.95rem;line-height:1;color:var(--muted)}
#found{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
#foundchips{display:contents}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 8px;font-size:.78rem;max-width:100%}
.fchip i{width:10px;height:10px;border-radius:50%;flex:none}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.fchip button{border:none;padding:0 5px;font-size:.95rem;line-height:1;color:var(--muted)}
#results button.on{background:rgba(255,138,61,.16)}
#results button.on .rn::after{content:" ✓";color:#ff8a3d}
@media (max-width:560px){#sunt{width:130px}#title h1{font-size:1.15rem}#title p{display:none}#title{max-width:calc(55vw - 18px)}input[type=range]{width:90px}#panel{gap:8px 10px;padding:8px 10px}#log{max-height:36%}}
</style>
</head>
<body>
<div id="map" aria-label="מפה תלת־ממדית של ישראל"></div>

<div id="title" class="card">
  <h1>תבליט ישראל</h1>
  <p>גרירה להזזה, שתי אצבעות לסיבוב והטיה, צביטה לזום. נגיעה במפה מסמנת נקודה וקוראת את הגובה שלה.</p>
  <div id="search">
    <span class="seg" role="group" aria-label="מה לחפש" id="stypes">
      <button id="s-place" aria-pressed="true">מקומות</button><button id="s-trail" aria-pressed="false">שבילים</button><button id="s-road" aria-pressed="false">כבישים</button>
    </span>
    <form id="sform" role="search">
      <input id="q" type="search" placeholder="שם של ישוב, הר או מקום" aria-label="חיפוש" autocomplete="off" enterkeyhint="search">
      <button type="submit">חפש</button>
    </form>
    <p id="smsg" hidden></p>
    <ul id="results" hidden></ul>
  </div>
</div>

<section id="log" class="card" aria-live="polite">
  <header>
    <span class="seg" role="tablist" aria-label="לשוניות">
      <button id="t-mine" role="tab" aria-pressed="false">הבחירות שלי <span id="mine-n"></span></button><button id="t-pins" role="tab" aria-pressed="true">נקודות גובה</button>
    </span>
    <button id="b-clear" hidden>ניקוי</button>
  </header>
  <div id="pane-pins">
    <div id="last">—</div>
    <div id="lastco">געו במפה כדי לסמן נקודה</div>
    <div id="lastnote"></div>
  </div>
  <ol id="rows"></ol>
  <div id="pane-mine" hidden>
    <ul id="mine"></ul>
    <div id="mineinfo"></div>
  </div>
</section>

<section id="prof" class="card" hidden aria-label="גרף גובה">
  <header><b id="profname"></b><span id="profstats"></span>
    <span class="pbtns"><button id="prof-clear" title="מחיקת הנקודות שסומנו">ניקוי נקודות</button><button id="prof-rev" title="היפוך כיוון המסלול">⇄</button><button id="prof-x" aria-label="סגירת הגרף">×</button></span></header>
  <canvas id="profcv"></canvas>
  <div id="profhover"></div>
</section>

<div id="panel" class="card">
  <div class="ctl">
    <span class="seg" role="group" aria-label="מקור נתונים">
      <button id="m-local" aria-pressed="true" title="הכל מהאתר עצמו, אזור ישראל בלבד">מקומי</button>
      <button id="m-global" aria-pressed="false" title="מפה ונתוני גובה משירותים חיצוניים, לכל העולם">עולמי</button>
    </span>
    <span class="seg" role="group" aria-label="צביעה">
      <button id="c-hyp" aria-pressed="true">לפי גובה</button>
      <button id="c-uni" aria-pressed="false">אפור</button>
    </span>
  </div>
  <div class="ctl">
    <label for="ex">הגזמה אנכית</label>
    <button id="ex-minus" class="step" aria-label="הקטנת ההגזמה">−</button>
    <input id="ex" type="range" min="1" max="6" step="0.5" value="2">
    <button id="ex-plus" class="step" aria-label="הגדלת ההגזמה">+</button>
    <span id="exv">×2</span>
  </div>
  <div class="ctl">
    <button id="b-sun" aria-pressed="false" title="יום ולילה: צללי השמש ואור הירח">שמש וירח</button>
    <button id="b-sat" aria-pressed="false" title="תמונת לוויין (במצב עולמי)">לוויין</button>
    <button id="b-lbl" aria-pressed="true">שמות</button>
    <button id="b-roads" aria-pressed="false">כבישים</button>
    <button id="b-trails" aria-pressed="false">שבילים</button>
    <button id="b-tracks" aria-pressed="false" title="דרכי עפר לפי רמת קושי">4×4</button>
    <button id="b-regions" aria-pressed="false" title="האזורים הגדולים: הגליל, השרון, הנגב…">אזורים</button>
    <button id="b-land" aria-pressed="false" title="מכתשים, בקעות, עמקים והרים">נוף</button>
    <button id="b-countries" aria-pressed="false">מדינות</button>
    <button id="b-reset">איפוס מבט</button>
  </div>
  <div class="ctl" id="sunctl" hidden>
    <span class="seg" role="group" aria-label="תאריך" id="sundates"></span>
    <span id="sundate"></span>
    <button id="sun-play" aria-pressed="false">▶ הרץ את היום</button>
    <span style="flex-basis:100%;height:0"></span>
    <button id="sun-minus" class="step" aria-label="חצי שעה אחורה">−</button>
    <input id="sunt" type="range" min="0" max="0" step="1" value="0">
    <button id="sun-plus" class="step" aria-label="חצי שעה קדימה">+</button>
    <span id="sunv">—</span>
    <span id="sunnote"></span>
  </div>
  <div class="ctl" id="trackctl" hidden>
    <span class="tk"><i style="background:#7ddc5a"></i>כל רכב</span>
    <span class="tk"><i style="background:#ffc23a"></i>רכב גבוה</span>
    <span class="tk"><i style="background:#ff4d4d"></i>4×4 בלבד</span>
    <span class="tk"><i style="background:#d8c9a8"></i>לא ידוע</span>
    <span id="tracknote"></span>
  </div>
  <div class="ctl" id="selctl" hidden>
    <select id="addsel" aria-label="הוספה לבחירה"><option value="">הוספה לבחירה…</option></select>
    <span id="selinfo">נגיעה במפה בוחרת ומבטלת. הבחירות מרוכזות ב"הבחירות שלי".</span>
  </div>
  <div id="legend">
    <div id="ramp"></div>
    <div id="ticks"><span>−430</span><span>0</span><span>1000</span><span>2000</span><span>2800 מ׳</span></div>
  </div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
// iPad browsers ignore user-scalable=no: stop the page pinch gesture directly, so only the map zooms and the panels keep their size
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&!e.target.closest('#map'))e.preventDefault();},{passive:false});
if(!window.maplibregl){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#9db0a8">לא הצלחתי לטעון את ספריית המפה. בדקו את החיבור לאינטרנט ורעננו.</p>');return;}

const BASE=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
const CREDIT_OSM='© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · © OpenMapTiles';
const CREDIT_COP='גובה: Copernicus DEM GLO-30 © DLR e.V., © Airbus Defence and Space GmbH, provided under COPERNICUS by the EU and ESA';
/* Two data modes. "local": everything is served from this site (map tiles built by .github/workflows/build-map.yml,
   elevation by build-terrain.yml), covering the Israel area. "global": OpenFreeMap + AWS Terrarium, the whole world. */
const LOCAL_BOUNDS=[34.0,29.3,36.2,33.6];
const SRC={
  local:{vector:{type:'vector',url:'pmtiles://'+BASE+'map/israel.pmtiles',attribution:CREDIT_OSM+' · '+CREDIT_COP},
    glyphs:BASE+'fonts/{fontstack}/{range}.pbf',
    dem:BASE+'terrain/{z}/{x}/{y}.webp',demMax:12,bounds:LOCAL_BOUNDS,
    note:'מנתוני Copernicus (רשת של כ־30 מ׳, דיוק טיפוסי של כמה מטרים)'},
  global:{vector:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:CREDIT_OSM+' · <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · Terrain: Mapzen / AWS Open Data'},
    glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    dem:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',demMax:15,elevZ:14,bounds:null,
    note:'מאריחי Terrarium (מבוסס SRTM, דיוק טיפוסי 5–15 מ׳)'}
};
if(window.pmtiles){const p=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',p.tile);}
const FONT=['Noto Sans Regular'], FONTB=['Noto Sans Bold'];
const NAME=['coalesce',['get','name:he'],['get','name']];

// hypsometric ramp (meters) shared by the map and the legend
const STOPS=[[-430,'#5c8054'],[-200,'#76965c'],[0,'#588a5c'],[150,'#8caa68'],[400,'#cdc482'],[700,'#c6a066'],[1000,'#aa764e'],[1400,'#8c6048'],[1900,'#a08c80'],[2400,'#cdc6c0'],[2800,'#f8f7f4']];
$('ramp').style.background='linear-gradient(to right,'+STOPS.map(([z,c])=>`${c} ${((z+430)/3230*100).toFixed(1)}%`).join(',')+')';

// libraries are kept in lib/ (MapLibre GL 5.9.0, mapbox-gl-rtl-text 0.3.0, PMTiles 4.4.1) so the site does not depend on a CDN
maplibregl.setRTLTextPlugin(new URL('lib/mapbox-gl-rtl-text.js',location.href).href,true).catch(()=>{});

const small=innerWidth<600;
const HOME={center:[35.05,31.45],zoom:small?6.6:7.25,pitch:55,bearing:60};   // looking north-east, from over the sea off Gaza and Sinai
const EMPTY={type:'FeatureCollection',features:[]};
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- everything the viewer has switched on lives here; the style is rebuilt from it ---------- */
const S={data:store.get('dataMode')==='global'?'global':'local',color:'hyp',ex:2,labels:true,roads:false,trails:false,tracks:false,roadSel:new Set(),satellite:false,land:false,stype:'place',sun:false,sunI:0,sunDate:'',regions:false,countries:false,sel:new Set()};
let ROADPICK=EMPTY,ROADS=null;   // picked roads, whole (from roads.geojson, made by tools/build_roads.py)
let REG=[],REG_BIG=[],REG_SUB=[],POIS=EMPTY,CTR=[],FOUND=EMPTY;   // REG = small regions first (they win a click), then the large ones
const fc=f=>({type:'FeatureCollection',features:f});
const labelsOf=list=>fc(list.map(f=>({type:'Feature',properties:{name:f.properties.name,small:!!f.properties.kind},geometry:{type:'Point',coordinates:[f.properties.lx,f.properties.ly]}})));

const SAT={type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,
  attribution:'לוויין: <a href="https://www.esri.com" target="_blank">Esri</a>, Maxar, Earthstar Geographics, and the GIS User Community'};
// normal relief shading: soft light from several directions. In sun mode it is replaced by one light from the sun.
const SHADE_MULTI={'hillshade-method':'multidirectional','hillshade-illumination-anchor':'viewport',
  'hillshade-highlight-color':['rgba(255,255,255,0.32)','rgba(255,250,240,0.18)','rgba(255,255,255,0.12)','rgba(255,255,255,0.12)'],
  'hillshade-shadow-color':['rgba(0,0,0,0.55)','rgba(0,0,0,0.35)','rgba(0,0,0,0.25)','rgba(0,0,0,0.25)'],

/* push S onto the current style: visibility, selection filters, colors */
function apply(){
  if(!map.getLayer('bg'))return;
  const vis=(id,on)=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none');};
  const sat=S.satellite&&S.data==='global';
  vis('satellite',sat);
  vis('relief',S.color==='hyp'&&!sat);
  $('legend').hidden=S.color!=='hyp'||sat;
  map.setPaintProperty('bg','background-color',S.color==='hyp'?'#4a4d4f':'#4d5053');
  LABEL_LAYERS.forEach(id=>vis(id,S.labels));
  vis('trails-paths',S.trails);
  ROAD_LAYERS.forEach(id=>vis(id,S.roads));
  vis('tracks-4x4',S.tracks);
  // picked roads stand out, the others fade
  const pick=S.roads&&S.roadSel.size>0;
  if(map.getSource('roadpick'))map.getSource('roadpick').setData(ROADPICK);
  map.setPaintProperty('roads-hl','line-opacity',pick?.25:1);
  map.setPaintProperty('roads-hl-case','line-opacity',pick?.15:.55);
  const own=['in',['to-string',['get','ref']],['literal',[...S.roadSel]]];
  map.setPaintProperty('road-shields','icon-opacity',pick?['case',own,1,.3]:1);
  map.setPaintProperty('road-shields','text-opacity',pick?['case',own,1,.3]:1);
  REGION_LAYERS.forEach(id=>vis(id,S.regions));
  LAND_LAYERS.forEach(id=>vis(id,S.land));
  ['region-sel','region-sel-line'].forEach(id=>vis(id,S.regions||S.land));
  COUNTRY_LAYERS.forEach(id=>vis(id,S.countries));
  const sel=['in',['get','id'],['literal',[...S.sel]]];
  ['region-sel','region-sel-line','country-sel','country-sel-line'].forEach(id=>map.setFilter(id,sel));
  // only the large regions are dimmed (a small one lies inside a large one and would be dimmed twice)
  map.setFilter('region-dim',['all',['!',sel],['!',['has','kind']]]);map.setFilter('country-dim',['!',sel]);
  ['region-dim','country-dim'].forEach(id=>map.setPaintProperty(id,'fill-opacity',S.sel.size?.35:0));
  setMarked(S.trails);
  setSun();
  refreshTerrain();
}

/* road number shields, drawn on a canvas and stretched around the number (styles lose images on a switch, so they are made on demand) */
const SHIELD={motorway:['#c23b30','#ffffff'],trunk:['#d7672c','#ffffff'],primary:['#f5c04a','#2a2108'],minor:['#ece6cc','#2a2108']};
function makeShield(id){
  const [fill,edge]=SHIELD[id.slice(7)]||SHIELD.minor, r=2, W=24, H=20;
  const c=document.createElement('canvas');c.width=W*r;c.height=H*r;const g=c.getContext('2d');g.scale(r,r);
  g.fillStyle=fill;g.strokeStyle=edge;g.lineWidth=1.5;
  g.beginPath();g.roundRect(1,1,W-2,H-2,4);g.fill();g.stroke();
  map.addImage(id,g.getImageData(0,0,W*r,H*r),{pixelRatio:r,stretchX:[[6*r,18*r]],stretchY:[[6*r,14*r]],content:[5*r,4*r,19*r,16*r]});

function setDataMode(m,first){
  S.data=m;store.set('dataMode',m);
  press('m-local',m==='local');press('m-global',m==='global');
  // satellite needs the external service: off and disabled in local mode
  if(m==='local'){S.satellite=false;press('b-sat',false);}
  $('b-sat').disabled=m==='local';
  if(first)return;
  markedFailed=false;
  map.setStyle(buildStyle(),{diff:false});
  map.once('style.load',()=>{apply();const c=map.getCenter(),b=LOCAL_BOUNDS;
    if(m==='local'&&(c.lng<b[0]||c.lng>b[2]||c.lat<b[1]||c.lat>b[3]))map.flyTo({...HOME,duration:1600});});
  pins.forEach(P=>{P.z=null;P.err=false;readPin(P);});render();
}

const AREAS=new Map();
function loadAreas(url,assign,btn,what){
  return fetch(url).then(r=>r.json()).then(d=>{assign(d.features);d.features.forEach(f=>AREAS.set(f.properties.id,f));
    const set=()=>{if(url!=='countries.geojson'){REG=[...REG_SUB,...REG_BIG];map.getSource('regions').setData(fc(REG));map.getSource('regionLabels').setData(labelsOf(REG));}
      else{map.getSource('countries').setData(fc(CTR));map.getSource('countryLabels').setData(labelsOf(CTR));}refreshTerrain();};
    map.isStyleLoaded()?set():map.once('load',set);fillPicker();})
   .catch(()=>{$(btn).disabled=true;$(btn).title=`קובץ ה${what} לא נטען`;});
}

loadAreas('subregions.geojson',f=>{REG_SUB=f.filter(x=>x.geometry.type!=='Point');POIS=fc(f.filter(x=>x.geometry.type==='Point'));
  const put=()=>map.getSource('pois')&&map.getSource('pois').setData(POIS);map.isStyleLoaded()?put():map.once('load',put);},'b-regions','אזורים');

  const alt=Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H));

function lightAt(sky){

const WORLD={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]]]}};
function setSun(){

      const id='sun-'+h,src=map.getSource(id);

const ROAD_COLORS=['#ffe14d','#4fd1ff','#ff5fa2','#b6f25c','#c49bff','#ff9f43'];
const roadColor=new Map();
async function loadRoads(){if(!ROADS)ROADS=await fetch(BASE+'roads.geojson').then(r=>r.json()).catch(()=>({features:[]}));return ROADS;}
function roadBox(ref){let w=180,s=90,e=-180,n=-90;
  for(const f of ROADS.features)if(f.properties.ref===ref)for(const l of f.geometry.coordinates)for(const [x,y] of l){w=Math.min(w,x);e=Math.max(e,x);s=Math.min(s,y);n=Math.max(n,y);}
  return [w,s,e,n];}
async function toggleRoad(ref,fly){

      .sort((a,b)=>a.score-b.score||b.t.km-a.t.km).slice(0,15).map(x=>({osm_type:'t',osm_id:x.t.id,trail:x.t}));

      polygon_geojson:'1',polygon_threshold:'0.0003',extratags:'1',viewbox:'34.2,33.4,35.95,29.4',bounded:'0'});
    const res=await fetch(u);if(!res.ok)throw new Error(res.status);
    const list=(await res.json()).filter(r=>trail?r.category==='route':r.category!=='route').slice(0,10);
    if(!list.length){showMsg(trail?'לא מצאתי שביל מסומן בשם הזה. נסו חלק מהשם, למשל "נחל דוד" או "שביל הגולן".':'לא נמצאו תוצאות. נסו שם אחר או כתיב אחר.');return;}
    showMsg(list.length>1?'אפשר לבחור כמה תוצאות. כל אחת תסומן בצבע משלה.':'');
    showResults(list,r=>{const parts=r.display_name.split(', ');
      const g=r.geojson||{};const k=trail&&g.type&&g.type!=='Point'?kmTxt(km(g))+' ק״מ':'';
      return [r.name||parts[0],[trail?'שביל מסומן':TYPE_HE[r.type],k,parts.slice(1,3).join(', ')].filter(Boolean).join(' · '),trail?trailColor(r.name,r.extratags||{}):null];},pick);

/* ---------- exact elevation read from the terrain tiles of the current data mode ---------- */
const tileCache=new Map();
function tilePixels(url){
  if(!tileCache.has(url)){
    tileCache.set(url,fetch(url)
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.blob();})
      .then(b=>createImageBitmap(b))
      .then(img=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);return g.getImageData(0,0,256,256).data;})
      .catch(e=>{tileCache.delete(url);throw e;}));
  }
  return tileCache.get(url);
}
async function elevationAt(lng,lat){
  const M=SRC[S.data],b=M.bounds;
  if(b&&(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3]))throw new Error('outside');
  const z=M.elevZ||M.demMax,n=2**z,r=Math.PI/180;
  const fx=(lng+180)/360*n*256-.5;
  const fy=(1-Math.log(Math.tan(lat*r)+1/Math.cos(lat*r))/Math.PI)/2*n*256-.5;
  const x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0;
  const val=async(px,py)=>{const d=await tilePixels(M.dem.replace('{z}',z).replace('{x}',Math.floor(px/256)).replace('{y}',Math.floor(py/256)));
    const i=(((py%256)+256)%256*256+((px%256)+256)%256)*4;return d[i]*256+d[i+1]+d[i+2]/256-32768;};
  const [a,bb,c,d]=await Promise.all([val(x0,y0),val(x0+1,y0),val(x0,y0+1),val(x0+1,y0+1)]);
  return (a*(1-tx)+bb*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
}

function distKm(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- elevation profile of a picked trail or road ---------- */
const SLOPE_COL=[[5,'#5fbf4a'],[10,'#e8c33a'],[15,'#f08a3a'],[1e9,'#e0453a']];   // % grade -> colour
const slopeColor=g=>SLOPE_COL.find(([m])=>Math.abs(g)<m)[1];
const PROF={name:'',pts:null,hover:-1,marks:[],markers:[],hoverMarker:null,color:'#ff8a3d'};
// join the pieces of a route into one line: start with the longest, keep adding the nearest piece (turned around if needed)
function chainRoute(g){
  const parts=(g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[]).filter(l=>l.length>1).map(l=>l.slice());
  if(!parts.length)return [];
  const d2=(a,b)=>((a[0]-b[0])*Math.cos(a[1]*Math.PI/180))**2+(a[1]-b[1])**2;
  parts.sort((a,b)=>km({type:'LineString',coordinates:b})-km({type:'LineString',coordinates:a}));
  let line=parts.shift();
  while(parts.length){
    let best=null;
    const A=line[0],B=line[line.length-1],span=d2(A,B);
    parts.forEach((p,i)=>{for(const [end,flip,front] of [[p[0],false,false],[p[p.length-1],true,false],[p[p.length-1],false,true],[p[0],true,true]]){
      // the piece must carry the line further away (so the other lane of a divided road is not added going back)
      const far=front?(flip?p[p.length-1]:p[0]):(flip?p[0]:p[p.length-1]);
      if(d2(front?B:A,far)<=span)continue;
      const d=d2(front?A:B,end);if(!best||d<best.d)best={d,i,flip,front};}});
    if(!best||best.d>(0.03)**2)break;                // nothing within ~3 km: the rest is not part of this line
    let p=parts.splice(best.i,1)[0];if(best.flip)p=p.reverse();
    line=best.front?p.concat(line):line.concat(p);
  }
  return line;
}
function resample(line){
  const segs=[];let tot=0;
  for(let i=1;i<line.length;i++){const d=km({type:'LineString',coordinates:[line[i-1],line[i]]});segs.push(d);tot+=d;}
  const step=Math.max(.03,tot/1500),out=[];let si=0,acc=0;
  for(let s=0;s<=tot+1e-9;s+=step){
    while(si<segs.length-1&&acc+segs[si]<s){acc+=segs[si];si++;}
    const t=segs[si]?Math.min(1,(s-acc)/segs[si]):0,a=line[si],b=line[si+1]||a;
    out.push({d:s,lng:a[0]+(b[0]-a[0])*t,lat:a[1]+(b[1]-a[1])*t});
  }
  return out;
}
async function openProfile(name,geom,color){
  closeProfile();
  const line=chainRoute(geom);if(line.length<2)return;
  PROF.name=name;PROF.color=color;PROF.marks=[];
  const pts=resample(line);
  $('prof').hidden=false;$('profstats').textContent='קורא גבהים…';$('profname').textContent=name;sizeProfile();
  try{
    for(let i=0;i<pts.length;i+=150)await Promise.all(pts.slice(i,i+150).map(p=>elevationAt(p.lng,p.lat).then(z=>p.z=z).catch(()=>p.z=null)));
  }catch(e){}
  const ok=pts.filter(p=>p.z!=null);
  if(ok.length<2){$('profstats').textContent=S.data==='local'?'אין נתוני גובה למסלול הזה (מחוץ לאזור המקומי). נסו במצב "עולמי".':'לא הצלחתי לקרוא גבהים.';return;}
  PROF.pts=ok;computeSlopes();drawProfile();
}
function computeSlopes(){
  const P=PROF.pts,n=P.length;
  // grade over ~100 m around each point (single 30 m steps are too noisy)
  for(let i=0;i<n;i++){let j=i,k=i;while(j>0&&P[i].d-P[j].d<.05)j--;while(k<n-1&&P[k].d-P[i].d<.05)k++;
    P[i].g=P[k].d>P[j].d?(P[k].z-P[j].z)/((P[k].d-P[j].d)*1000)*100:0;}
}
function reverseProfile(){if(!PROF.pts)return;const L=PROF.pts[PROF.pts.length-1].d;PROF.pts=PROF.pts.reverse().map(p=>({...p,d:L-p.d}));
  PROF.marks=PROF.marks.map(i=>PROF.pts.length-1-i);computeSlopes();drawProfile();}
function closeProfile(){$('prof').hidden=true;PROF.pts=null;PROF.marks=[];PROF.markers.forEach(m=>m.remove());PROF.markers=[];
  if(PROF.hoverMarker){PROF.hoverMarker.remove();PROF.hoverMarker=null;}}
function sizeProfile(){$('prof').style.bottom=($('panel').offsetHeight+42)+'px';}
addEventListener('resize',()=>{if(!$('prof').hidden){sizeProfile();drawProfile();}});
function drawProfile(){
  const P=PROF.pts,cv=$('profcv');if(!P)return;
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const L=P[P.length-1].d;let zmin=Infinity,zmax=-Infinity;for(const p of P){zmin=Math.min(zmin,p.z);zmax=Math.max(zmax,p.z);}
  const pad=Math.max(10,(zmax-zmin)*.12);const lo=zmin-pad,hi=zmax+pad;
  const ml=44,mr=8,mt=8,mb=20,X=d=>ml+(W-ml-mr)*d/L,Y=z=>mt+(H-mt-mb)*(1-(z-lo)/(hi-lo));
  PROF.X=X;PROF.ml=ml;PROF.mr=mr;PROF.W=W;PROF.L=L;
  // grid + labels
  g.font='11px system-ui,sans-serif';g.fillStyle='rgba(230,240,235,.65)';g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;
  const zs=niceStep((hi-lo)/4);for(let z=Math.ceil(lo/zs)*zs;z<=hi;z+=zs){const y=Y(z);g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.textAlign='right';g.fillText(Math.round(z)+'',ml-6,y+4);}
  const ds=niceStep(L/6);g.textAlign='center';for(let d=0;d<=L+1e-9;d+=ds)g.fillText((ds<1?d.toFixed(1):Math.round(d))+(d===0?'':''),X(d),H-5);
  g.textAlign='left';g.fillText('ק״מ',W-mr-22,H-5);
  // area coloured by grade
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];g.fillStyle=slopeColor(b.g)+'cc';
    g.beginPath();g.moveTo(X(a.d),Y(a.z));g.lineTo(X(b.d),Y(b.z));g.lineTo(X(b.d),H-mb);g.lineTo(X(a.d),H-mb);g.closePath();g.fill();}
  g.strokeStyle='#f4f1e8';g.lineWidth=1.6;g.beginPath();P.forEach((p,i)=>i?g.lineTo(X(p.d),Y(p.z)):g.moveTo(X(p.d),Y(p.z)));g.stroke();
  // marked points
  PROF.marks.forEach((i,n)=>{const p=P[i];g.strokeStyle='#ffffff';g.setLineDash([3,3]);g.beginPath();g.moveTo(X(p.d),mt);g.lineTo(X(p.d),H-mb);g.stroke();g.setLineDash([]);
    g.fillStyle='#ff5fa2';g.beginPath();g.arc(X(p.d),Y(p.z),5,0,7);g.fill();g.fillStyle='#fff';g.textAlign='center';g.font='bold 11px system-ui';g.fillText(String(n+1),X(p.d),mt+10);g.font='11px system-ui,sans-serif';});
  // hover
  if(PROF.hover>=0){const p=P[PROF.hover];g.strokeStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(X(p.d),mt);g.lineTo(X(p.d),H-mb);g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(X(p.d),Y(p.z),4,0,7);g.fill();}
  // summary
  let up=0,down=0,gmax=0;for(let i=1;i<P.length;i++){const dz=P[i].z-P[i-1].z;if(dz>0)up+=dz;else down-=dz;gmax=Math.max(gmax,Math.abs(P[i].g));}
  const parts=[`${kmTxt(L)} ק״מ`,`↑ ${fmt(up)} מ׳`,`↓ ${fmt(down)} מ׳`,`גובה מ־${fmt(zmin)} עד ${fmt(zmax)} מ׳`,`שיפוע מרבי ${Math.round(gmax)}%`];
  const M=PROF.marks.slice().sort((a,b)=>a-b);
  for(let k=1;k<M.length;k++){let u=0,dn=0;for(let i=M[k-1]+1;i<=M[k];i++){const dz=P[i].z-P[i-1].z;if(dz>0)u+=dz;else dn-=dz;}
    parts.push(`${PROF.marks.indexOf(M[k-1])+1}→${PROF.marks.indexOf(M[k])+1}: ${kmTxt(P[M[k]].d-P[M[k-1]].d)} ק״מ, ↑${fmt(u)} ↓${fmt(dn)}`);}
  $('profstats').textContent=parts.join(' · ');
  showHoverText();
}
function niceStep(x){const p=10**Math.floor(Math.log10(x)),f=x/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function showHoverText(){
  const P=PROF.pts,i=PROF.hover;
  $('profhover').textContent=i<0?'הזיזו את האצבע על הגרף; נגיעה מסמנת נקודה על המסלול':`${kmTxt(P[i].d)} ק״מ · ${fmt(P[i].z)} מ׳ · שיפוע ${Math.round(P[i].g)}%`;
}
function profIndex(ev){const r=$('profcv').getBoundingClientRect(),x=ev.clientX-r.left;
  const d=Math.max(0,Math.min(PROF.L,(x-PROF.ml)/(PROF.W-PROF.ml-PROF.mr)*PROF.L));
  let lo=0,hi=PROF.pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(PROF.pts[m].d<d)lo=m;else hi=m;}
  return d-PROF.pts[lo].d<PROF.pts[hi].d-d?lo:hi;}
function setHover(i){
  PROF.hover=i;const p=PROF.pts[i];
  if(!PROF.hoverMarker){const el=document.createElement('div');el.className='profdot';PROF.hoverMarker=new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map);}
  PROF.hoverMarker.setLngLat([p.lng,p.lat]);drawProfile();
}
function markPoint(i){
  const k=PROF.marks.indexOf(i);
  if(k>=0){PROF.marks.splice(k,1);}else PROF.marks.push(i);
  PROF.markers.forEach(m=>m.remove());
  PROF.markers=PROF.marks.map((j,n)=>{const p=PROF.pts[j],el=document.createElement('div');el.className='pin';
    const b=document.createElement('b');b.textContent=`${n+1} · ${fmt(p.z)} מ׳`;b.style.background='#ff5fa2';
    const s=document.createElement('s');s.style.background='#ff5fa2';const ii=document.createElement('i');ii.style.background='#ff5fa2';el.append(b,ii,s);
    return new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map);});
  drawProfile();
}
(()=>{const cv=$('profcv');let down=null;
  cv.addEventListener('pointerdown',e=>{if(!PROF.pts)return;down={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);setHover(profIndex(e));});
  cv.addEventListener('pointermove',e=>{if(!PROF.pts)return;if(e.pointerType==='mouse'||down)setHover(profIndex(e));});
  cv.addEventListener('pointerup',e=>{if(!PROF.pts||!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<8)markPoint(profIndex(e));down=null;});
  cv.addEventListener('pointerleave',()=>{if(!down&&PROF.pts){PROF.hover=-1;if(PROF.hoverMarker){PROF.hoverMarker.remove();PROF.hoverMarker=null;}drawProfile();}});
})();
$('prof-x').onclick=closeProfile;
$('prof-rev').onclick=reverseProfile;
$('prof-clear').onclick=()=>{PROF.marks=[];PROF.markers.forEach(m=>m.remove());PROF.markers=[];drawProfile();};

window.reliefMap=map;
render();renderMine();
})();
</script>
</body>
