<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תבליט ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
/* Layout: full-bleed map; title block top-right; survey point log top-left; instrument bar bottom */
:root{
  --bg:#0f1716; --panel:rgba(18,28,26,.88); --line:#2c3d39; --fg:#e8efe9; --muted:#9db0a8;
  --accent:#e9b84a; --pin:#ff7a4d;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#map{position:fixed;inset:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:10px 14px;max-width:min(300px,calc(50vw - 18px));z-index:2}
#title h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.1}
#title p{margin:.3rem 0 0;color:var(--muted);font-size:.82rem;line-height:1.4}
#log{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:min(300px,calc(50vw - 18px));padding:8px 10px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 200px);z-index:2}
#log header{display:flex;align-items:center;justify-content:space-between;gap:6px}
#log h2{margin:0;font-size:.85rem;font-weight:700;color:var(--muted)}
#last{font-family:var(--display);font-size:1.5rem;color:var(--accent);line-height:1.1}
#lastco{color:var(--muted);font-size:.74rem;direction:ltr;text-align:right}
#lastnote{color:var(--muted);font-size:.72rem}
#rows{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
#rows li{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;font-size:.82rem;padding:3px 2px;border-top:1px solid var(--line)}
#rows .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pin);color:#1b0c05;font-weight:700;font-size:.72rem}
#rows .h{font-weight:700}
#rows .d{color:var(--muted);font-size:.74rem;white-space:nowrap}
#rows button{padding:0 6px;border:none;color:var(--muted);font-size:1rem;line-height:1}
#panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:860px;margin-inline:auto;z-index:2}
.ctl{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.ctl label{color:var(--muted);white-space:nowrap}
input[type=range]{accent-color:var(--accent);width:120px}
button.step{width:30px;height:30px;padding:0;font-size:1.1rem;line-height:1;font-weight:700}
#exv,#sunv{font-variant-numeric:tabular-nums;min-width:2.6em;font-weight:700}
#sunctl{flex:1 1 100%}
#sunt{width:200px}
#sunnote{color:var(--muted);font-size:.78rem}
#sundate{font-size:.82rem;color:var(--muted)}
button{font:inherit;font-size:.86rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button[aria-pressed=true]{background:var(--accent);color:#1b1607;border-color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;border-radius:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend{display:flex;flex-direction:column;gap:3px;flex:1 1 180px;min-width:0}
#ramp{height:10px;border-radius:3px}
#ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.pin{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.pin b{font:700 .78rem var(--body);color:#1b0c05;background:var(--pin);padding:1px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.pin i{width:2px;height:10px;background:var(--pin)}
.pin s{width:9px;height:9px;border-radius:50%;background:var(--pin);box-shadow:0 0 0 2px #1b0c05;text-decoration:none}
.maplibregl-ctrl-attrib{font-size:10px}
#search{position:relative;margin-top:8px}
#search form{display:flex;gap:6px}
#q{flex:1;min-width:0;font:inherit;font-size:.9rem;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
#q::placeholder{color:var(--muted)}
#results{list-style:none;margin:6px 0 0;padding:0;max-height:min(50vh,320px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#results button{width:100%;text-align:right;border:none;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;background:transparent}
#results button:hover,#results button:focus-visible{background:rgba(233,184,74,.14)}
#results .rn{font-weight:700;font-size:.88rem}
#results .rd{color:var(--muted);font-size:.74rem;line-height:1.3}
#smsg{color:var(--muted);font-size:.78rem;margin:6px 0 0}
#addsel{font:inherit;font-size:.86rem;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:46vw}
#selinfo{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
#selctl{flex:1 1 100%}
#chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:2px;background:rgba(243,196,90,.18);border:1px solid #f3c45a;color:var(--fg);border-radius:999px;padding:1px 4px 1px 9px;font-size:.8rem}
.chip button{border:none;padding:0 5px;font-size:.95rem;line-height:1;color:var(--muted)}
#found{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
#foundchips{display:contents}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 8px;font-size:.78rem;max-width:100%}
.fchip i{width:10px;height:10px;border-radius:50%;flex:none}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.fchip button{border:none;padding:0 5px;font-size:.95rem;line-height:1;color:var(--muted)}
#results button.on{background:rgba(255,138,61,.16)}
#results button.on .rn::after{content:" ✓";color:#ff8a3d}
@media (max-width:560px){#sunt{width:130px}#title h1{font-size:1.15rem}#title p{display:none}#title{max-width:calc(55vw - 18px)}input[type=range]{width:90px}#panel{gap:8px 10px;padding:8px 10px}#log{max-height:36%}}
</style>
</head>
<body>
<div id="map" aria-label="מפה תלת־ממדית של ישראל"></div>

<div id="title" class="card">
  <h1>תבליט ישראל</h1>
  <p>גרירה להזזה, שתי אצבעות לסיבוב והטיה, צביטה לזום. נגיעה במפה מסמנת נקודה וקוראת את הגובה שלה.</p>
  <div id="search">
    <form id="sform" role="search">
      <input id="q" type="search" placeholder="חיפוש מקום, הר או מסלול" aria-label="חיפוש" autocomplete="off" enterkeyhint="search">
      <button type="submit">חפש</button>
    </form>
    <p id="smsg" hidden></p>
    <ul id="results" hidden></ul>
    <div id="found" hidden>
      <span id="foundchips"></span>
      <button id="b-route">ניקוי הסימונים</button>
    </div>
  </div>
</div>

<section id="log" class="card" aria-live="polite">
  <header>
    <h2>נקודות גובה</h2>
    <button id="b-clear" hidden>ניקוי</button>
  </header>
  <div>
    <div id="last">—</div>
    <div id="lastco">געו במפה כדי לסמן נקודה</div>
    <div id="lastnote"></div>
  </div>
  <ol id="rows"></ol>
</section>

<div id="panel" class="card">
  <div class="ctl">
    <span class="seg" role="group" aria-label="מקור נתונים">
      <button id="m-local" aria-pressed="true" title="הכל מהאתר עצמו, אזור ישראל בלבד">מקומי</button>
      <button id="m-global" aria-pressed="false" title="מפה ונתוני גובה משירותים חיצוניים, לכל העולם">עולמי</button>
    </span>
    <span class="seg" role="group" aria-label="צביעה">
      <button id="c-hyp" aria-pressed="true">לפי גובה</button>
      <button id="c-uni" aria-pressed="false">אפור</button>
    </span>
  </div>
  <div class="ctl">
    <label for="ex">הגזמה אנכית</label>
    <button id="ex-minus" class="step" aria-label="הקטנת ההגזמה">−</button>
    <input id="ex" type="range" min="1" max="6" step="0.5" value="2">
    <button id="ex-plus" class="step" aria-label="הגדלת ההגזמה">+</button>
    <span id="exv">×2</span>
  </div>
  <div class="ctl">
    <button id="b-sun" aria-pressed="false" title="יום ולילה: צללי השמש ואור הירח">שמש וירח</button>
    <button id="b-sat" aria-pressed="false" title="תמונת לוויין (במצב עולמי)">לוויין</button>
    <button id="b-lbl" aria-pressed="true">שמות</button>
    <button id="b-roads" aria-pressed="false">כבישים</button>
    <button id="b-trails" aria-pressed="false">שבילים</button>
    <button id="b-regions" aria-pressed="false">אזורים</button>
    <button id="b-countries" aria-pressed="false">מדינות</button>
    <button id="b-reset">איפוס מבט</button>
  </div>
  <div class="ctl" id="sunctl" hidden>
    <span class="seg" role="group" aria-label="תאריך" id="sundates"></span>
    <span id="sundate"></span>
    <button id="sun-play" aria-pressed="false">▶ הרץ את היום</button>
    <span style="flex-basis:100%;height:0"></span>
    <button id="sun-minus" class="step" aria-label="חצי שעה אחורה">−</button>
    <input id="sunt" type="range" min="0" max="0" step="1" value="0">
    <button id="sun-plus" class="step" aria-label="חצי שעה קדימה">+</button>
    <span id="sunv">—</span>
    <span id="sunnote"></span>
  </div>
  <div class="ctl" id="selctl" hidden>
    <select id="addsel" aria-label="הוספה לבחירה"><option value="">הוספה לבחירה…</option></select>
    <span id="chips"></span>
    <span id="selinfo"></span>
    <button id="b-selclear" hidden>ניקוי בחירה</button>
  </div>
  <div id="legend">
    <div id="ramp"></div>
    <div id="ticks"><span>−430</span><span>0</span><span>1000</span><span>2000</span><span>2800 מ׳</span></div>
  </div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.maplibregl){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#9db0a8">לא הצלחתי לטעון את ספריית המפה. בדקו את החיבור לאינטרנט ורעננו.</p>');return;}

const BASE=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
const CREDIT_OSM='© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · © OpenMapTiles';
const CREDIT_COP='גובה: Copernicus DEM GLO-30 © DLR e.V., © Airbus Defence and Space GmbH, provided under COPERNICUS by the EU and ESA';
/* Two data modes. "local": everything is served from this site (map tiles built by .github/workflows/build-map.yml,
   elevation by build-terrain.yml), covering the Israel area. "global": OpenFreeMap + AWS Terrarium, the whole world. */
const LOCAL_BOUNDS=[34.0,29.3,36.2,33.6];
const SRC={
  local:{vector:{type:'vector',url:'pmtiles://'+BASE+'map/israel.pmtiles',attribution:CREDIT_OSM+' · '+CREDIT_COP},
    glyphs:BASE+'fonts/{fontstack}/{range}.pbf',
    dem:BASE+'terrain/{z}/{x}/{y}.webp',demMax:12,bounds:LOCAL_BOUNDS,
    note:'מנתוני Copernicus (רשת של כ־30 מ׳, דיוק טיפוסי של כמה מטרים)'},
  global:{vector:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:CREDIT_OSM+' · <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · Terrain: Mapzen / AWS Open Data'},
    glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    dem:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',demMax:15,elevZ:14,bounds:null,
    note:'מאריחי Terrarium (מבוסס SRTM, דיוק טיפוסי 5–15 מ׳)'}
};
if(window.pmtiles){const p=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',p.tile);}
const FONT=['Noto Sans Regular'], FONTB=['Noto Sans Bold'];
const NAME=['coalesce',['get','name:he'],['get','name']];

// hypsometric ramp (meters) shared by the map and the legend
const STOPS=[[-430,'#5c8054'],[-200,'#76965c'],[0,'#588a5c'],[150,'#8caa68'],[400,'#cdc482'],[700,'#c6a066'],[1000,'#aa764e'],[1400,'#8c6048'],[1900,'#a08c80'],[2400,'#cdc6c0'],[2800,'#f8f7f4']];
$('ramp').style.background='linear-gradient(to right,'+STOPS.map(([z,c])=>`${c} ${((z+430)/3230*100).toFixed(1)}%`).join(',')+')';

// libraries are kept in lib/ (MapLibre GL 5.9.0, mapbox-gl-rtl-text 0.3.0, PMTiles 4.4.1) so the site does not depend on a CDN
maplibregl.setRTLTextPlugin(new URL('lib/mapbox-gl-rtl-text.js',location.href).href,true).catch(()=>{});

const small=innerWidth<600;
const HOME={center:[35.05,31.45],zoom:small?6.4:7.0,pitch:55,bearing:-15};
const EMPTY={type:'FeatureCollection',features:[]};
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- everything the viewer has switched on lives here; the style is rebuilt from it ---------- */
const S={data:store.get('dataMode')==='global'?'global':'local',color:'hyp',ex:2,labels:true,roads:false,trails:false,satellite:false,sun:false,sunI:0,sunDate:'',regions:false,countries:false,sel:new Set()};
let REG=[],CTR=[],FOUND=EMPTY;
const fc=f=>({type:'FeatureCollection',features:f});
const labelsOf=list=>fc(list.map(f=>({type:'Feature',properties:{name:f.properties.name},geometry:{type:'Point',coordinates:[f.properties.lx,f.properties.ly]}})));

const SAT={type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,
  attribution:'לוויין: <a href="https://www.esri.com" target="_blank">Esri</a>, Maxar, Earthstar Geographics, and the GIS User Community'};
// normal relief shading: soft light from several directions. In sun mode it is replaced by one light from the sun.
const SHADE_MULTI={'hillshade-method':'multidirectional','hillshade-illumination-anchor':'viewport',
  'hillshade-highlight-color':['rgba(255,255,255,0.32)','rgba(255,250,240,0.18)','rgba(255,255,255,0.12)','rgba(255,255,255,0.12)'],
  'hillshade-shadow-color':['rgba(0,0,0,0.55)','rgba(0,0,0,0.35)','rgba(0,0,0,0.25)','rgba(0,0,0,0.25)'],
  'hillshade-illumination-direction':[315,270,0,45],'hillshade-illumination-altitude':[35,40,40,45],
  // no fades: a fade between the 4-light and 1-light values is not possible
  'hillshade-highlight-color-transition':{duration:0},'hillshade-shadow-color-transition':{duration:0}};
function buildStyle(){
  const M=SRC[S.data];
  const dem={type:'raster-dem',tiles:[M.dem],encoding:'terrarium',tileSize:256,maxzoom:M.demMax};
  if(M.bounds)dem.bounds=M.bounds;
  const hide={visibility:'none'};
  return {
    version:8,glyphs:M.glyphs,
    sources:{omt:M.vector,dem:{...dem},demShade:{...dem},
      regions:{type:'geojson',data:fc(REG)},regionLabels:{type:'geojson',data:labelsOf(REG)},
      countries:{type:'geojson',data:fc(CTR)},countryLabels:{type:'geojson',data:labelsOf(CTR)},
      found:{type:'geojson',data:FOUND},
      // satellite imagery streams from Esri, so it exists in global mode only
      ...(S.data==='global'?{sat:SAT}:{})},
    sky:{'sky-color':'#0f1716','horizon-color':'#26302d','fog-color':'#0f1716','sky-horizon-blend':.6,'horizon-fog-blend':.6,'fog-ground-blend':.75,'atmosphere-blend':0},
    terrain:{source:'dem',exaggeration:S.ex},
    layers:[
      {id:'bg',type:'background',paint:{'background-color':'#4a4d4f'}},
      {id:'relief',type:'color-relief',source:'demShade',paint:{'color-relief-opacity':1,'color-relief-color':['interpolate',['linear'],['elevation'],...STOPS.flat()]}},
      ...(S.data==='global'?[{id:'satellite',type:'raster',source:'sat',layout:hide,paint:{'raster-fade-duration':150}}]:[]),
      {id:'shade',type:'hillshade',source:'demShade',paint:{...SHADE_MULTI}},
      {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':'#2e5c7c'}},
      {id:'river',type:'line',source:'omt','source-layer':'waterway',minzoom:9,filter:['in',['get','class'],['literal',['river','stream']]],
        paint:{'line-color':'#4f8fb3','line-width':['interpolate',['linear'],['zoom'],9,.4,14,1.6],'line-opacity':.7}},
      {id:'border',type:'line',source:'omt','source-layer':'boundary',filter:['==',['get','admin_level'],2],
        paint:{'line-color':'#e8efe9','line-opacity':.35,'line-width':1,'line-dasharray':[3,2]}},
      {id:'country-dim',type:'fill',source:'countries',layout:hide,paint:{'fill-color':'#05080a','fill-opacity':0}},
      {id:'country-sel',type:'fill',source:'countries',layout:hide,paint:{'fill-color':'#f3c45a','fill-opacity':.3}},
      {id:'country-lines',type:'line',source:'countries',layout:{...hide,'line-join':'round'},
        paint:{'line-color':'#e8efe9','line-opacity':.6,'line-width':['interpolate',['linear'],['zoom'],2,.5,8,1.5]}},
      {id:'country-sel-line',type:'line',source:'countries',layout:{...hide,'line-join':'round'},
        paint:{'line-color':'#ffd166','line-width':['interpolate',['linear'],['zoom'],2,1.5,8,4]}},
      {id:'region-dim',type:'fill',source:'regions',layout:hide,paint:{'fill-color':'#05080a','fill-opacity':0}},
      {id:'region-sel',type:'fill',source:'regions',layout:hide,paint:{'fill-color':'#f3c45a','fill-opacity':.32}},
      {id:'region-lines',type:'line',source:'regions',layout:{...hide,'line-join':'round'},
        paint:{'line-color':'#f3d48a','line-opacity':.75,'line-width':['interpolate',['linear'],['zoom'],6,.8,11,2],'line-dasharray':[4,2]}},
      {id:'region-sel-line',type:'line',source:'regions',layout:{...hide,'line-join':'round'},
        paint:{'line-color':'#ffd166','line-width':['interpolate',['linear'],['zoom'],6,2.5,11,4.5]}},
      {id:'roads-major',type:'line',source:'omt','source-layer':'transportation',minzoom:8,
        filter:['in',['get','class'],['literal',['motorway','trunk','primary']]],
        paint:{'line-color':'#f2e6c9','line-opacity':['interpolate',['linear'],['zoom'],8,.18,12,.45],'line-width':['interpolate',['linear'],['zoom'],8,.5,14,2.5]}},
      {id:'roads-minor',type:'line',source:'omt','source-layer':'transportation',minzoom:11,
        filter:['in',['get','class'],['literal',['secondary','tertiary','minor']]],
        paint:{'line-color':'#f2e6c9','line-opacity':.28,'line-width':['interpolate',['linear'],['zoom'],11,.3,15,1.4]}},
      // "roads" layer: stronger road lines by class, with route numbers in small shields (see makeShield)
      {id:'roads-hl-case',type:'line',source:'omt','source-layer':'transportation',minzoom:6,layout:{...hide,'line-join':'round','line-cap':'round'},
        filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary']]],
        paint:{'line-color':'#1a1410','line-opacity':.55,'line-width':['interpolate',['linear'],['zoom'],6,['match',['get','class'],['motorway','trunk'],2.2,1.2],12,['match',['get','class'],['motorway','trunk'],6,'primary',5,3.5],15,['match',['get','class'],['motorway','trunk'],10,8]]}},
      {id:'roads-hl',type:'line',source:'omt','source-layer':'transportation',minzoom:6,layout:{...hide,'line-join':'round','line-cap':'round'},
        filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary']]],

function inRing(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [xi,yi]=ring[i],[xj,yj]=ring[j];

  return polys.some(p=>inRing(pt,p[0])&&!p.slice(1).some(h=>inRing(pt,h)));}

  return f?f.properties.id:'';

/* ---------- sun and moon over a whole day (24 h, every half hour).
   Cast shadows of the sun are precomputed by tools/build_shadows.py (Israel only, while the sun is up);
   sun and moon positions, moon phase, twilight and night are computed here. ---------- */
let SUN=null;                 // shadows/manifest.json once loaded
const SITE=[35.0,31.5];
// four full-moon days: the moon rides highest in December and lowest in June (opposite to the sun)
const SUN_DAYS={'20261223':['דצמבר','23 בדצמבר 2026 · ירח מלא, כמעט מעל הראש'],'20270321':['מרץ','21 במרץ 2027 · ירח מלא, עולה במזרח'],
  '20270618':['יוני','18 ביוני 2027 · ירח מלא נמוך בדרום'],'20270915':['ספטמבר','15 בספטמבר 2027 · ירח מלא, עולה במזרח']};
const DAY=()=>SUN.dates[S.sunDate];
const SLOTS=48;               // 00:00 … 23:30
function sunFrames(){return SUN?DAY().frames:[];}
function sunUrl(f,half){return BASE+`shadows/${S.sunDate}/${f.f}-${half}.png`;}
function sunCoords(half){const [W,S_,E,N]=SUN.bounds,m=SUN.split;
  return half==='n'?[[W,N],[E,N],[E,m],[W,m]]:[[W,m],[E,m],[E,S_],[W,S_]];}

/* sky positions (formulas as in the SunCalc library, about 1° accurate) */
const RAD=Math.PI/180, OBL=RAD*23.4397;
const ra=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const dec=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
function sunEq(d){const M=RAD*(357.5291+0.98560028*d),C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)),L=M+C+RAD*102.9372+Math.PI;
  return {ra:ra(L,0),dec:dec(L,0),dist:149598000};}
function moonEq(d){const L=RAD*(218.316+13.176396*d),M=RAD*(134.963+13.064993*d),F=RAD*(93.272+13.229350*d);
  const l=L+RAD*6.289*Math.sin(M),b=RAD*5.128*Math.sin(F);return {ra:ra(l,b),dec:dec(l,b),dist:385001-20905*Math.cos(M)};}
function horizontal(c,d,lng,lat){const H=RAD*(280.16+360.9856235*d)+RAD*lng-c.ra,phi=RAD*lat;
  const alt=Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(c.dec)*Math.cos(phi));
  return {az:(az/RAD+180+360)%360,alt:alt/RAD};}
function skyAt(slot){
  const D=DAY(), date=Date.UTC(D.y,D.m-1,D.d,0,slot*30)-D.tz*3600e3, d=date/864e5-0.5+2440588-2451545;
  const s=sunEq(d),m=moonEq(d);
  const sun=horizontal(s,d,...SITE),moon=horizontal(m,d,...SITE);
  // lit fraction of the moon and whether it is growing (for the phase symbol)
  const phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(s.dist*Math.sin(phi),m.dist-s.dist*Math.cos(phi));
  const ang=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));

}
const slotTime=i=>String(Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00');
const MOON_ICONS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(c,a)=>`rgba(${c.map(Math.round).join(',')},${a.toFixed(3)})`;
const clamp01=x=>Math.max(0,Math.min(1,x));

/* how the scene is lit at one moment: a color veil over the ground (orange at dusk, deep blue at night)
   and one light for the slope shading (the sun by day, the moon at night) */
function lightAt(sky){
  const a=sky.sun.alt, mo=sky.moon;
  const moonGlow=mo.alt>0?mo.frac*clamp01(Math.sin(mo.alt*RAD)*2.5):0;   // 0 … 1
  const NIGHT=[8,14,40], DUSK=[255,128,80], GOLD=[255,170,90];
  let veil=[0,0,0],op=0,light='sun';
  if(a>=6){op=0;}
  else if(a>=0){veil=GOLD;op=.16*(1-a/6);}                                 // golden hour
  else if(a>=-6){const t=-a/6;veil=mix(DUSK,NIGHT,t);op=.28+.52*t;}         // sunset / dawn glow
  else{const t=clamp01((-a-6)/12);veil=NIGHT;op=.82+.11*t;light='moon';}     // night, darker until -18°
  if(light==='moon')op-=.2*moonGlow;                                       // a bright high moon lifts the dark
  return {veil,op,light,moonGlow};
}
const WORLD={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]]]}};
function setSun(){
  if(!map.getLayer('shade'))return;
  const on=S.sun&&SUN, sky=on&&skyAt(S.sunI), f=on&&sunFrames().find(x=>x.t===slotTime(S.sunI));
  // cast shadows (only while the sun is up)
  if(f){
    for(const h of ['n','s']){
      const id='sun-'+h,src=map.getSource(id);
      if(src){if(src.url!==sunUrl(f,h))src.updateImage({url:sunUrl(f,h),coordinates:sunCoords(h)});}
      else{map.addSource(id,{type:'image',url:sunUrl(f,h),coordinates:sunCoords(h)});
        map.addLayer({id,type:'raster',source:id,paint:{'raster-opacity':.38,'raster-fade-duration':0,'raster-resampling':'linear'}},'river');}  // above the sea and lakes, so shade on water shows
    }
  }else for(const h of ['n','s'])if(map.getLayer('sun-'+h)){map.removeLayer('sun-'+h);map.removeSource('sun-'+h);}
  if(!on){
    for(const k in SHADE_MULTI)map.setPaintProperty('shade',k,SHADE_MULTI[k]);
    if(map.getLayer('moonlit'))map.removeLayer('moonlit');

  let P;
  if(L.light==='sun')P={dir:sky.sun.az,alt:Math.max(sky.sun.alt,15),hi:'rgba(255,240,210,0.30)',sh:'rgba(10,14,30,0.6)'};
  // moonlight: silver on the slopes facing the moon, deep dark on the others
  else if(sky.moon.alt>0)P={dir:sky.moon.az,alt:Math.max(sky.moon.alt,10),hi:`rgba(215,228,255,${(.7*L.moonGlow).toFixed(3)})`,sh:`rgba(0,2,12,${(.4+.4*L.moonGlow).toFixed(3)})`};
  else P={dir:315,alt:45,hi:'rgba(0,0,0,0)',sh:'rgba(0,2,12,0.3)'};   // no moon: only a faint relief
  const Q={'hillshade-method':'standard','hillshade-illumination-anchor':'map','hillshade-illumination-direction':P.dir,
    'hillshade-illumination-altitude':P.alt,'hillshade-highlight-color':P.hi,'hillshade-shadow-color':P.sh};
  for(const k in Q)map.setPaintProperty('shade',k,Q[k]);
  // the veil sits over ground, water and shadows, under roads and names (they stay readable at night)
  if(!map.getSource('night'))map.addSource('night',{type:'geojson',data:WORLD});
  if(!map.getLayer('night'))map.addLayer({id:'night',type:'fill',source:'night',paint:{'fill-color':'#000','fill-opacity':0,'fill-opacity-transition':{duration:0},'fill-color-transition':{duration:0}}},'river');
  map.setPaintProperty('night','fill-color',rgba(L.veil,1));
  map.setPaintProperty('night','fill-opacity',Math.max(0,L.op));
  // moonlight is painted over the dark veil, so moon-facing slopes glow silver out of the night.
  // A high moon lights everything evenly; a low moon lights only the slopes that face it.
  const moonOn=L.light==='moon'&&sky.moon.alt>0&&L.moonGlow>.02;
  if(moonOn){
    if(!map.getLayer('moonlit'))map.addLayer({id:'moonlit',type:'hillshade',source:'demShade',paint:{'hillshade-method':'basic','hillshade-illumination-anchor':'map',
      'hillshade-shadow-color':'rgba(0,0,0,0)','hillshade-accent-color':'rgba(0,0,0,0)','hillshade-highlight-color':'rgba(0,0,0,0)','hillshade-highlight-color-transition':{duration:0}}},'river');
    map.setPaintProperty('moonlit','hillshade-illumination-direction',sky.moon.az);
    map.setPaintProperty('moonlit','hillshade-illumination-altitude',Math.max(sky.moon.alt,5));
    map.setPaintProperty('moonlit','hillshade-highlight-color',`rgba(200,216,255,${(.3*L.moonGlow).toFixed(3)})`);
  }else if(map.getLayer('moonlit'))map.removeLayer('moonlit');
}
// a new shadow image is drawn on the 3D ground only after the draped texture is refreshed
map.on('sourcedata',e=>{if(e.sourceId&&e.sourceId.startsWith('sun-')&&e.isSourceLoaded)refreshTerrain();});
function showSunTime(){
  if(!SUN){$('sunv').textContent='—';$('sunnote').textContent='';return;}
  const sky=skyAt(S.sunI),s=sky.sun,m=sky.moon;
  $('sunv').textContent=slotTime(S.sunI);
  const icon=MOON_ICONS[Math.round(m.phase*8)%8], moonTxt=`${icon} ירח ${Math.round(m.frac*100)}% מואר`+(m.alt>0?`, בגובה ${Math.round(m.alt)}°`:', מתחת לאופק');
  $('sunnote').textContent=s.alt>0?`☀ שמש בגובה ${Math.round(s.alt)}°`+(m.alt>0?` · ${moonTxt}`:'')
    :(s.alt>-6?'דמדומים · ':'לילה · ')+moonTxt;
}
function setSunI(i){S.sunI=(i+SLOTS)%SLOTS;$('sunt').value=S.sunI;showSunTime();setSun();refreshTerrain();}
async function loadSun(){
  if(SUN)return true;
  try{const r=await fetch(BASE+'shadows/manifest.json');if(!r.ok)throw 0;SUN=await r.json();}catch(e){return false;}
  $('sunt').max=SLOTS-1;
  // date buttons; start with the day closest in the year to today
  const doy=x=>{const t=new Date(x.y,x.m-1,x.d);return (t-new Date(t.getFullYear(),0,0))/864e5;};
  const today=doy({y:2001,m:new Date().getMonth()+1,d:new Date().getDate()});
  let best=1e9;
  for(const k in SUN.dates){
    const b=document.createElement('button');b.textContent=SUN_DAYS[k]?SUN_DAYS[k][0]:k;b.dataset.k=k;b.setAttribute('aria-pressed','false');
    b.onclick=()=>setSunDate(k);$('sundates').append(b);
    const dd=Math.abs(doy({...SUN.dates[k],y:2001})-today),gap=Math.min(dd,365-dd);if(gap<best){best=gap;S.sunDate=k;}
  }
  markSunDate();
  // start at the current time of day
  const now=new Date();S.sunI=now.getHours()*2+(now.getMinutes()>=30?1:0);
  preloadSun();
  return true;
}
// fetch every shadow frame of the day in the background so moving the slider is instant
function preloadSun(){sunFrames().forEach(f=>['n','s'].forEach(h=>{const im=new Image();im.src=sunUrl(f,h);}));}
function markSunDate(){
  document.querySelectorAll('#sundates button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===S.sunDate));
  $('sundate').textContent=(SUN_DAYS[S.sunDate]||[,''])[1];
}
function setSunDate(k){S.sunDate=k;markSunDate();preloadSun();showSunTime();setSun();refreshTerrain();}
/* "run the day": half an hour per step, round and round until pressed again.
   The next step waits until the map has drawn the previous one (and at least 0.35 s), so a slow device never piles up work. */
let playT=null;
function setPlay(on){
  clearTimeout(playT);playT=null;press('sun-play',on);$('sun-play').textContent=on?'⏸ עצירה':'▶ הרץ את היום';
  if(on){
    const step=()=>{if(!playT)return;setSunI(S.sunI+1);
      const t0=performance.now();
      map.once('idle',()=>{if(playT)playT=setTimeout(step,Math.max(0,350-(performance.now()-t0)));});};
    playT=setTimeout(step,0);
  }
}
$('sun-play').onclick=()=>setPlay(!playT);
$('b-sun').onclick=async()=>{
  if(!S.sun&&!(await loadSun())){showMsg('קובץ הצללים לא נטען.');return;}
  S.sun=!S.sun;press('b-sun',S.sun);$('sunctl').hidden=!S.sun;
  if(!S.sun)setPlay(false);
  if(S.sun){$('sunt').value=S.sunI;showSunTime();}
  apply();
};
// moving the time by hand stops the animation
$('sunt').addEventListener('input',e=>{if(playT)setPlay(false);setSunI(+e.target.value);});
$('sun-minus').onclick=()=>{if(playT)setPlay(false);setSunI(S.sunI-1);};
$('sun-plus').onclick=()=>{if(playT)setPlay(false);setSunI(S.sunI+1);};

map.on('error',e=>{
  if(e.sourceId!=='marked'||markedFailed)return;
  markedFailed=true;setMarked(false);refreshTerrain();
  showMsg('שכבת המסלולים המסומנים לא זמינה כרגע. מוצגים השבילים מהמפה בלבד.');
});

/* ---------- search (OpenStreetMap Nominatim; one request per search, as its usage policy asks) ---------- */
const TYPE_HE={city:'עיר',town:'עיירה',village:'יישוב',hamlet:'יישוב',suburb:'שכונה',neighbourhood:'שכונה',peak:'פסגה',hill:'גבעה',
  ridge:'רכס',valley:'עמק',stream:'נחל',river:'נהר',wadi:'ואדי',spring:'מעיין',hiking:'מסלול הליכה',bicycle:'מסלול אופניים',
  water:'מקום מים',lake:'אגם',cave_entrance:'מערה',viewpoint:'תצפית',nature_reserve:'שמורת טבע',national_park:'גן לאומי',
  attraction:'אטרקציה',archaeological_site:'אתר עתיקות',cliff:'מצוק',crater:'מכתש',administrative:'אזור'};
const results=$('results'),smsg=$('smsg');
let searching=false;
function showMsg(t){smsg.textContent=t;smsg.hidden=!t;}
/* several search results can stay on the map together, each in its own color */
const FCOLORS=['#ff8a3d','#4fd1ff','#ff5fa2','#b6f25c','#ffd166','#c49bff','#ff6b5b','#5cf2c1'];
const picked=new Map();   // osm key -> {name,color,geometry,bbox}
let colorIx=0;
const keyOf=r=>r.osm_type+r.osm_id;
function syncFound(){
  FOUND=fc([...picked.entries()].map(([k,p])=>({type:'Feature',properties:{key:k,name:p.name,color:p.color},geometry:p.geometry})));
  const src=map.getSource('found');if(src)src.setData(FOUND);
  const box=$('foundchips');box.textContent='';
  for(const [k,p] of picked){
    const c=document.createElement('span');c.className='fchip';
    const dot=document.createElement('i');dot.style.background=p.color;
    const t=document.createElement('span');t.textContent=p.name;
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','הסרת '+p.name);x.onclick=()=>{picked.delete(k);syncFound();markResults();};
    c.append(dot,t,x);box.append(c);
  }
  $('found').hidden=!picked.size;
  refreshTerrain();
}
function fitPicked(){
  if(!picked.size)return;
  let w=180,s=90,e=-180,n=-90;
  for(const p of picked.values()){const [bs,bn,bw,be]=p.bbox;w=Math.min(w,bw);s=Math.min(s,bs);e=Math.max(e,be);n=Math.max(n,bn);}
  if(n-s<0.01&&e-w<0.01)map.flyTo({center:[(w+e)/2,(s+n)/2],zoom:13.5,pitch:60,duration:2000});
  else map.fitBounds([[w,s],[e,n]],{padding:{top:160,bottom:200,left:60,right:60},pitch:50,duration:2000,maxZoom:14});
}
$('b-route').onclick=()=>{picked.clear();syncFound();markResults();};
let lastList=[];
function markResults(){[...results.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',!!lastList[i]&&picked.has(keyOf(lastList[i]))));}
function pick(r){
  const k=keyOf(r);
  if(picked.has(k))picked.delete(k);
  else{
    const g=r.geojson&&r.geojson.type!=='Point'?r.geojson:{type:'Point',coordinates:[+r.lon,+r.lat]};
    picked.set(k,{name:r.name||r.display_name.split(', ')[0],color:FCOLORS[colorIx++%FCOLORS.length],geometry:g,bbox:r.boundingbox.map(Number)});
  }
  syncFound();markResults();fitPicked();
}
$('sform').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=$('q').value.trim();if(!q||searching)return;
  searching=true;results.hidden=true;showMsg('מחפש…');
  try{
    const u='https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q,format:'jsonv2','accept-language':'he',limit:'8',
      polygon_geojson:'1',polygon_threshold:'0.0003',viewbox:'34.2,33.4,35.95,29.4',bounded:'0'});
    const res=await fetch(u);if(!res.ok)throw new Error(res.status);
    const list=await res.json();
    results.textContent='';lastList=list;
    if(!list.length){showMsg('לא נמצאו תוצאות. נסו שם אחר או כתיב אחר.');return;}
    showMsg('');
    for(const r of list){
      const li=document.createElement('li'),b=document.createElement('button');b.type='button';
      const parts=r.display_name.split(', ');
      const n=document.createElement('span');n.className='rn';n.textContent=r.name||parts[0];
      const d=document.createElement('span');d.className='rd';d.textContent=[TYPE_HE[r.type],parts.slice(1,3).join(', ')].filter(Boolean).join(' · ');
      b.append(n,d);b.onclick=()=>pick(r);li.append(b);results.append(li);
    }
    results.hidden=false;markResults();
    if(list.length>1)showMsg('אפשר לבחור כמה תוצאות. כל אחת תסומן בצבע משלה.');
  }catch(err){showMsg('החיפוש לא הצליח. בדקו את החיבור לאינטרנט ונסו שוב בעוד רגע.');}
  finally{searching=false;}
});
$('q').addEventListener('input',()=>{if(!$('q').value){results.hidden=true;showMsg('');}});

/* ---------- exact elevation read from the terrain tiles of the current data mode ---------- */
const tileCache=new Map();
function tilePixels(url){
  if(!tileCache.has(url)){
    tileCache.set(url,fetch(url)
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.blob();})
      .then(b=>createImageBitmap(b))
      .then(img=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);return g.getImageData(0,0,256,256).data;})
      .catch(e=>{tileCache.delete(url);throw e;}));
  }
  return tileCache.get(url);
}
async function elevationAt(lng,lat){
  const M=SRC[S.data],b=M.bounds;
  if(b&&(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3]))throw new Error('outside');
  const z=M.elevZ||M.demMax,n=2**z,r=Math.PI/180;
  const fx=(lng+180)/360*n*256-.5;
  const fy=(1-Math.log(Math.tan(lat*r)+1/Math.cos(lat*r))/Math.PI)/2*n*256-.5;
  const x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0;
  const val=async(px,py)=>{const d=await tilePixels(M.dem.replace('{z}',z).replace('{x}',Math.floor(px/256)).replace('{y}',Math.floor(py/256)));
    const i=(((py%256)+256)%256*256+((px%256)+256)%256)*4;return d[i]*256+d[i+1]+d[i+2]/256-32768;};
  const [a,bb,c,d]=await Promise.all([val(x0,y0),val(x0+1,y0),val(x0,y0+1),val(x0+1,y0+1)]);
  return (a*(1-tx)+bb*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
}

/* ---------- survey pins ---------- */
const pins=[];
const fmt=n=>Math.round(n).toLocaleString('he-IL');
function distKm(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const hText=P=>P.z==null?'…':fmt(P.z)+' מ׳';
function render(){
  const rows=$('rows');rows.textContent='';
  pins.forEach((P,i)=>{
    P.label.textContent=`${i+1} · ${hText(P)}`;
    const li=document.createElement('li'),prev=pins[i-1];
    li.innerHTML='<span class="n"></span><span class="h"></span><span class="d"></span><button></button>';
    li.querySelector('.n').textContent=i+1;
    li.querySelector('.h').textContent=hText(P);
    if(prev&&P.z!=null&&prev.z!=null){const dz=P.z-prev.z;li.querySelector('.d').textContent=`${dz>=0?'+':'−'}${fmt(Math.abs(dz))} מ׳ · ${distKm(prev,P).toFixed(1)} ק״מ`;}
    const b=li.querySelector('button');b.textContent='×';b.setAttribute('aria-label',`מחיקת נקודה ${i+1}`);b.onclick=()=>removePin(i);
    rows.appendChild(li);
  });
  $('b-clear').hidden=!pins.length;
  const P=pins[pins.length-1];
  if(!P){$('last').textContent='—';$('lastco').textContent='געו במפה כדי לסמן נקודה';$('lastnote').textContent='';return;}
  $('last').textContent=hText(P);
  $('lastco').textContent=`${P.lat.toFixed(5)}°N  ${P.lng.toFixed(5)}°E`;
  $('lastnote').textContent=P.err==='outside'?'הנקודה מחוץ לאזור המקומי. לקריאת גובה כאן עברו למצב "עולמי".':P.err?'לא הצלחתי לקרוא את הגובה. בדקו את החיבור לאינטרנט.':P.z==null?'קורא גובה…':SRC[S.data].note;
}
function addPin(lngLat){
  const el=document.createElement('div');el.className='pin';
  const label=document.createElement('b');el.append(label,document.createElement('i'),document.createElement('s'));
  const marker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(lngLat).addTo(map);
  const P={lng:lngLat.lng,lat:lngLat.lat,z:null,marker,label,err:false};
  pins.push(P);render();readPin(P);
}
function readPin(P){
  elevationAt(P.lng,P.lat).then(z=>{P.z=z;render();}).catch(e=>{P.err=e&&e.message==='outside'?'outside':true;render();});
}
function removePin(i){pins.splice(i,1)[0].marker.remove();render();}
$('b-clear').onclick=()=>{while(pins.length)removePin(pins.length-1);};
map.on('click',e=>{if(!results.hidden){results.hidden=true;return;}
  if(S.regions||S.countries){toggleSel(areaAt(e.lngLat),false);return;}
  addPin(e.lngLat);});
window.reliefMap=map;
render();
})();
</script>
